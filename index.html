<script>

var mediaStore = {
  nowm: '',
  wm: '',
  mp3: ''
};

var imageStore = [];


/* =========================
   PASTE BUTTON
========================= */

async function pasteLink() {
  var input = document.getElementById('tiktokUrl');

  try {

    if (navigator.clipboard && navigator.clipboard.readText) {

      var text = await navigator.clipboard.readText();

      if (text) {
        input.value = text;
        input.focus();
        return;
      }
    }

  } catch (e) {}

  /*
    Clipboard permission fail hone par
    input ko focus kar do.
  */

  input.focus();
}


/* =========================
   FETCH TIKTOK
========================= */

async function processVideo() {

  var url = document
    .getElementById('tiktokUrl')
    .value
    .trim();

  var btn = document.getElementById('fetchBtn');

  var resultCard = document.getElementById('resultCard');


  if (!url) {

    btn.innerText = 'PASTE LINK FIRST!';

    setTimeout(function() {
      btn.innerText = 'FETCH VIDEO';
    }, 2000);

    return;
  }


  /*
    Basic TikTok URL check
  */

  if (
    !url.includes('tiktok.com') &&
    !url.includes('vt.tiktok.com') &&
    !url.includes('vm.tiktok.com')
  ) {

    btn.innerText = 'INVALID TIKTOK LINK!';

    setTimeout(function() {
      btn.innerText = 'FETCH VIDEO';
    }, 2000);

    return;
  }


  btn.innerText = 'FETCHING...';
  btn.disabled = true;

  resultCard.style.display = 'none';


  /*
    Reset old data
  */

  mediaStore = {
    nowm: '',
    wm: '',
    mp3: ''
  };

  imageStore = [];

  hideImageSection();


  try {

    /*
      IMPORTANT:

      TikWM API current request:
      POST
      NOT GET
    */

    var response = await fetch(
      'https://www.tikwm.com/api/',
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'application/x-www-form-urlencoded; charset=UTF-8',

          'Accept':
            'application/json, text/plain, */*'
        },

        body: new URLSearchParams({
          url: url,
          hd: '1'
        })
      }
    );


    if (!response.ok) {
      throw new Error(
        'API HTTP ERROR: ' +
        response.status
      );
    }


    var json = await response.json();


    console.log(
      'TikWM Response:',
      json
    );


    /*
      API failed
    */

    if (
      !json ||
      json.code !== 0 ||
      !json.data
    ) {

      throw new Error(
        json && json.msg
          ? json.msg
          : 'TikTok data not found'
      );
    }


    var data = json.data;


    /* =========================
       VIDEO
    ========================= */

    mediaStore.nowm =
      data.play ||
      data.hdplay ||
      data.wmplay ||
      '';


    mediaStore.wm =
      data.wmplay ||
      data.play ||
      '';


    /* =========================
       MP3
    ========================= */

    mediaStore.mp3 =
      data.music ||
      '';


    /* =========================
       COVER
    ========================= */

    document.getElementById(
      'coverImg'
    ).src =
      data.cover ||
      data.origin_cover ||
      '';


    /* =========================
       AUTHOR
    ========================= */

    var username = 'user';

    if (
      data.author &&
      typeof data.author === 'object'
    ) {

      username =
        data.author.unique_id ||
        data.author.nickname ||
        'user';

    }


    document.getElementById(
      'authorTag'
    ).innerText =
      '@' + username;


    /* =========================
       CAPTION
    ========================= */

    document.getElementById(
      'videoCaption'
    ).innerText =
      data.title ||
      'TikTok Video';


    /* =========================
       IMAGE / SLIDESHOW
    ========================= */

    processTikTokImages(data);


    /* =========================
       SHOW RESULT
    ========================= */

    resultCard.style.display =
      'block';


    btn.innerText =
      'FETCH VIDEO';


  } catch (error) {

    console.error(
      'Snap-Tok Error:',
      error
    );


    btn.innerText =
      'FETCH FAILED';


    /*
      Result card ko completely hide
      rakho agar API fail ho.
    */

    resultCard.style.display =
      'none';


    setTimeout(function() {

      btn.innerText =
        'FETCH VIDEO';

    }, 2500);

  }


  btn.disabled = false;

}


/* =========================
   PROCESS TIKTOK IMAGES
========================= */

function processTikTokImages(data) {

  var images = [];


  /*
    Normal TikWM image array
  */

  if (Array.isArray(data.images)) {
    images = data.images;
  }


  /*
    Kuch responses mein image_post
    ya image arrays aa sakti hain.
  */

  if (
    !images.length &&
    Array.isArray(data.image_post)
  ) {

    images =
      data.image_post;

  }


  if (
    !images.length &&
    Array.isArray(data.image_urls)
  ) {

    images =
      data.image_urls;

  }


  /*
    No images
  */

  if (!images.length) {

    hideImageSection();

    return;
  }


  imageStore = [];


  images.forEach(function(item) {

    var cleanUrl = '';
    var watermarkUrl = '';


    /*
      Agar item direct string ho
    */

    if (
      typeof item === 'string'
    ) {

      cleanUrl = item;

    }


    /*
      Agar item object ho
    */

    else if (
      item &&
      typeof item === 'object'
    ) {

      cleanUrl =
        item.url ||
        item.image ||
        item.src ||
        item.download ||
        item.image_url ||
        item.origin ||
        '';


      watermarkUrl =
        item.wm_url ||
        item.wm ||
        item.watermark_url ||
        item.watermark ||
        '';


      /*
        URL list support
      */

      if (
        !cleanUrl &&
        Array.isArray(item.url_list)
      ) {

        cleanUrl =
          item.url_list[0] ||
          '';

      }

    }


    if (cleanUrl) {

      imageStore.push({

        nowm: cleanUrl,

        wm: watermarkUrl,

        selected: true

      });

    }

  });


  if (!imageStore.length) {

    hideImageSection();

    return;
  }


  renderImageSelector();

}


/* =========================
   IMAGE SELECTOR
========================= */

function renderImageSelector() {

  var section =
    document.getElementById(
      'imageSection'
    );

  var grid =
    document.getElementById(
      'imageGrid'
    );

  var count =
    document.getElementById(
      'imageCount'
    );


  if (!section || !grid) {
    return;
  }


  grid.innerHTML = '';


  count.innerText =
    imageStore.length;


  imageStore.forEach(
    function(item, index) {

      var box =
        document.createElement(
          'div'
        );

      box.className =
        'image-item selected';

      box.setAttribute(
        'data-index',
        index
      );


      var img =
        document.createElement(
          'img'
        );

      img.src =
        item.nowm;

      img.alt =
        'TikTok Image ' +
        (index + 1);


      /*
        Broken image protection
      */

      img.onerror =
        function() {

          this.style.opacity =
            '0.35';

        };


      var check =
        document.createElement(
          'div'
        );

      check.className =
        'image-check';

      check.innerText =
        '✓';


      var number =
        document.createElement(
          'div'
        );

      number.className =
        'image-number';

      number.innerText =
        '#' +
        (index + 1);


      box.appendChild(img);

      box.appendChild(check);

      box.appendChild(number);


      box.onclick =
        function() {

          toggleImageSelection(
            index
          );

        };


      grid.appendChild(box);

    }
  );


  updateSelectedInfo();


  section.style.display =
    'block';

}


/* =========================
   SELECT / UNSELECT IMAGE
========================= */

function toggleImageSelection(
  index
) {

  if (!imageStore[index]) {
    return;
  }


  imageStore[index].selected =
    !imageStore[index].selected;


  var item =
    document.querySelector(
      '.image-item[data-index="' +
      index +
      '"]'
    );


  if (item) {

    if (
      imageStore[index].selected
    ) {

      item.classList.add(
        'selected'
      );

    } else {

      item.classList.remove(
        'selected'
      );

    }

  }


  updateSelectedInfo();

}


/* =========================
   SELECT ALL
========================= */

function toggleSelectAll() {

  if (!imageStore.length) {
    return;
  }


  var allSelected =
    imageStore.every(
      function(item) {
        return item.selected;
      }
    );


  imageStore.forEach(
    function(item) {

      item.selected =
        !allSelected;

    }
  );


  document
    .querySelectorAll(
      '.image-item'
    )
    .forEach(
      function(item, index) {

        if (
          imageStore[index].selected
        ) {

          item.classList.add(
            'selected'
          );

        } else {

          item.classList.remove(
            'selected'
          );

        }

      }
    );


  updateSelectedInfo();

}


/* =========================
   SELECTED COUNTER
========================= */

function updateSelectedInfo() {

  var info =
    document.getElementById(
      'selectedInfo'
    );

  var button =
    document.getElementById(
      'selectAllBtn'
    );


  if (!info || !button) {
    return;
  }


  var selectedCount =
    imageStore.filter(
      function(item) {
        return item.selected;
      }
    ).length;


  info.innerText =
    selectedCount +
    ' SELECTED';


  var allSelected =
    imageStore.length > 0 &&
    selectedCount ===
      imageStore.length;


  button.innerText =
    allSelected
      ? 'UNSELECT ALL'
      : 'SELECT ALL';

}


/* =========================
   DOWNLOAD IMAGES
========================= */

async function downloadSelectedImages(
  type
) {

  var selected =
    imageStore.filter(
      function(item) {
        return item.selected;
      }
    );


  if (!selected.length) {

    var info =
      document.getElementById(
        'selectedInfo'
      );

    info.innerText =
      'SELECT AN IMAGE FIRST!';


    setTimeout(
      function() {
        updateSelectedInfo();
      },
      1800
    );


    return;
  }


  var buttonId =
    type === 'nowm'
      ? 'imageNoWmBtn'
      : 'imageWmBtn';


  var button =
    document.getElementById(
      buttonId
    );


  var originalText =
    button.innerText;


  button.disabled =
    true;

  button.innerText =
    'DOWNLOADING...';


  for (
    var i = 0;
    i < selected.length;
    i++
  ) {

    var item =
      selected[i];


    var targetUrl =
      type === 'wm'
        ? (
            item.wm ||
            item.nowm
          )
        : item.nowm;


    if (!targetUrl) {
      continue;
    }


    await downloadImageFile(
      targetUrl,
      'SnapTok_Image_' +
      (imageStore.indexOf(item) + 1) +
      '_' +
      Date.now() +
      '.jpg'
    );


    await sleep(500);

  }


  button.innerText =
    originalText;

  button.disabled =
    false;

}


/* =========================
   IMAGE DOWNLOAD
========================= */

async function downloadImageFile(
  url,
  filename
) {

  try {

    var response =
      await fetch(url);


    if (!response.ok) {
      throw new Error(
        'Image download failed'
      );
    }


    var blob =
      await response.blob();


    var blobUrl =
      URL.createObjectURL(
        blob
      );


    var a =
      document.createElement(
        'a'
      );


    a.href =
      blobUrl;

    a.download =
      filename;

    a.style.display =
      'none';


    document.body.appendChild(a);

    a.click();


    setTimeout(
      function() {

        URL.revokeObjectURL(
          blobUrl
        );

        a.remove();

      },
      1000
    );


  } catch (error) {

    /*
      Direct fallback
    */

    var a =
      document.createElement(
        'a'
      );


    a.href =
      url;

    a.download =
      filename;

    a.target =
      '_blank';


    document.body.appendChild(a);

    a.click();

    a.remove();

  }

}


/* =========================
   HIDE IMAGE AREA
========================= */

function hideImageSection() {

  var section =
    document.getElementById(
      'imageSection'
    );


  if (section) {

    section.style.display =
      'none';

  }

}


/* =========================
   DELAY
========================= */

function sleep(ms) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}


/* =========================
   VIDEO / MP3 DOWNLOAD
========================= */

async function downloadDirect(
  type
) {

  var targetUrl =
    mediaStore[type];


  if (!targetUrl) {

    return;

  }


  var buttonId =
    type === 'nowm'
      ? 'dlNoWmBtn'
      : (
          type === 'wm'
            ? 'dlWmBtn'
            : 'dlMp3Btn'
        );


  var button =
    document.getElementById(
      buttonId
    );


  var originalText =
    button.innerText;


  button.innerText =
    'DOWNLOADING...';


  button.disabled =
    true;


  var extension =
    type === 'mp3'
      ? '.mp3'
      : '.mp4';


  var filename =
    'SnapTok_' +
    Date.now() +
    extension;


  try {

    var response =
      await fetch(
        targetUrl
      );


    if (!response.ok) {
      throw new Error(
        'Download failed'
      );
    }


    var blob =
      await response.blob();


    var blobUrl =
      URL.createObjectURL(
        blob
      );


    var a =
      document.createElement(
        'a'
      );


    a.href =
      blobUrl;

    a.download =
      filename;

    a.style.display =
      'none';


    document.body.appendChild(a);

    a.click();


    setTimeout(
      function() {

        URL.revokeObjectURL(
          blobUrl
        );

        a.remove();

      },
      1000
    );


  } catch (error) {

    /*
      Direct URL fallback
    */

    var a =
      document.createElement(
        'a'
      );


    a.href =
      targetUrl;

    a.download =
      filename;

    a.target =
      '_blank';


    document.body.appendChild(a);

    a.click();

    a.remove();

  }


  button.innerText =
    originalText;

  button.disabled =
    false;

}

  </script>
