<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap-Tok | Ultra-Fast TikTok Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #090d16;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Glows */
        .bg-glow-1 {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 350px;
            height: 350px;
            background: rgba(0, 242, 254, 0.18);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 0;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 350px;
            height: 350px;
            background: rgba(254, 0, 80, 0.18);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 0;
            animation: pulseGlow 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.9; }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #00f2fe 0%, #fe0050 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .brand p {
            color: #9ca3af;
            font-size: 0.88rem;
        }

        /* Input Section */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 44px 16px 16px;
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid #374151;
            border-radius: 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }

        .clear-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 1.1rem;
            display: none;
            transition: color 0.2s;
        }

        .clear-btn:hover {
            color: #ffffff;
        }

        /* Buttons Style */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-fetch {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #090d16;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .btn-fetch:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.45);
        }

        .btn-refresh {
            background: rgba(55, 65, 81, 0.6);
            color: #d1d5db;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-refresh:hover {
            background: rgba(75, 85, 99, 0.8);
            color: #ffffff;
        }

        /* Status Toast / Loader */
        .status-toast {
            display: none;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        .status-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.25);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 242, 254, 0.3);
            border-top: 2px solid #00f2fe;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-error {
            display: block;
            background: rgba(254, 0, 80, 0.1);
            color: #fe0050;
            border: 1px solid rgba(254, 0, 80, 0.25);
        }

        /* Preview Dynamic Card */
        .preview-card {
            display: none;
            background: rgba(31, 41, 55, 0.6);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .video-meta {
            display: flex;
            gap: 14px;
            margin-bottom: 18px;
            align-items: center;
        }

        .thumb {
            width: 85px;
            height: 110px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .meta-details {
            flex: 1;
            overflow: hidden;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .author-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .author-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #00f2fe;
        }

        .caption {
            font-size: 0.85rem;
            color: #d1d5db;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.35;
        }

        /* Download Options */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-dl-nowm {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-dl-nowm:hover { background: #059669; }

        .btn-dl-wm {
            background: #6366f1;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-dl-wm:hover { background: #4f46e5; }

        .btn-dl-mp3 {
            background: #fe0050;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(254, 0, 80, 0.25);
        }

        .btn-dl-mp3:hover { background: #e11d48; }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <div class="brand">
            <h1>Snap-Tok</h1>
            <p>Ultra-Fast TikTok Video & MP3 Downloader</p>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" id="videoUrl" placeholder="Paste TikTok video link here..." autocomplete="off">
                <button class="clear-btn" id="clearBtn" onclick="clearInput()">✕</button>
            </div>
            <button class="btn btn-fetch" id="fetchBtn" onclick="fetchVideo()">⚡ Fetch Video</button>
            <button class="btn btn-refresh" onclick="resetPage()">🔄 Refresh Page</button>
        </div>

        <div id="statusToast" class="status-toast"></div>

        <div class="preview-card" id="previewCard">
            <div class="video-meta">
                <img id="coverImg" class="thumb" src="" alt="Thumbnail">
                <div class="meta-details">
                    <div class="author-info">
                        <img id="authorAvatar" class="author-avatar" src="" alt="Avatar">
                        <span id="authorName" class="author-name">@user</span>
                    </div>
                    <p id="videoCaption" class="caption">Video Description...</p>
                </div>
            </div>

            <div class="actions">
                <a id="dlNoWm" class="btn btn-dl-nowm" href="#" target="_blank" rel="noopener noreferrer">⬇ Download Without Watermark</a>
                <a id="dlWm" class="btn btn-dl-wm" href="#" target="_blank" rel="noopener noreferrer">⬇ Download With Watermark</a>
                <a id="dlMp3" class="btn btn-dl-mp3" href="#" target="_blank" rel="noopener noreferrer">🎵 Download MP3 Audio</a>
            </div>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('videoUrl');
        const clearBtn = document.getElementById('clearBtn');
        const statusToast = document.getElementById('statusToast');
        const previewCard = document.getElementById('previewCard');

        inputField.addEventListener('input', () => {
            clearBtn.style.display = inputField.value ? 'block' : 'none';
        });

        function clearInput() {
            inputField.value = '';
            clearBtn.style.display = 'none';
            inputField.focus();
        }

        function resetPage() {
            inputField.value = '';
            clearBtn.style.display = 'none';
            previewCard.style.display = 'none';
            statusToast.className = 'status-toast';
            statusToast.style.display = 'none';
        }

        async function fetchVideo() {
            const url = inputField.value.trim();
            if (!url) {
                showStatus("Please paste a TikTok link first!", "error");
                return;
            }

            showLoadingStatus("Fetching real video details... Please wait");
            previewCard.style.display = 'none';

            try {
                // Primary CDN API call to TikWM
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data && data.code === 0) {
                    const video = data.data;

                    // Dynamically setting exact content
                    document.getElementById('coverImg').src = video.cover;
                    document.getElementById('authorAvatar').src = (video.author && video.author.avatar) ? video.author.avatar : video.cover;
                    document.getElementById('authorName').innerText = `@${(video.author && video.author.unique_id) ? video.author.unique_id : 'tiktok_user'}`;
                    document.getElementById('videoCaption').innerText = video.title || 'TikTok Video';

                    // Direct CDN Download links
                    document.getElementById('dlNoWm').href = video.play;
                    document.getElementById('dlWm').href = video.wmplay;
                    document.getElementById('dlMp3').href = video.music;

                    statusToast.style.display = 'none';
                    previewCard.style.display = 'block';
                } else {
                    showStatus("Invalid TikTok link or video is private. Try another link.", "error");
                }
            } catch (err) {
                showStatus("Network issue or API blocked. Please try again in a few seconds.", "error");
            }
        }

        function showLoadingStatus(message) {
            statusToast.innerHTML = `<div class="spinner"></div> <span>${message}</span>`;
            statusToast.className = 'status-toast status-loading';
            statusToast.style.display = 'flex';
        }

        function showStatus(message, type) {
            statusToast.innerHTML = message;
            statusToast.className = `status-toast status-${type}`;
            statusToast.style.display = 'block';
        }
    </script>
</body>
                   </html>
