<style>
/* ==========================================================================
   TIKGRAB — styles.css
   Dark glassmorphism UI • neon cyan/pink accents • fully responsive
   (Unchanged in v2.1 — all fixes are in the JavaScript layer)
   ========================================================================== */

/* ---------- 1. Reset & tokens ---------- */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070f;
  --bg-soft:#0c0c1a;
  --panel:rgba(255,255,255,.05);
  --panel-strong:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.10);
  --text:#eef0ff;
  --muted:#9aa0bc;
  --cyan:#25f4ee;
  --pink:#fe2c55;
  --violet:#8b5cf6;
  --green:#34f5a4;
  --grad:linear-gradient(94deg,var(--cyan),var(--pink));
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --font-display:'Unbounded',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.9,.3,1);
  --glow-cyan:0 0 24px rgba(37,244,238,.35);
  --glow-pink:0 0 24px rgba(254,44,85,.35);
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
}
::selection{background:rgba(37,244,238,.35)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}

/* ---------- 2. Ambient background layers ---------- */
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:54px 54px;
  -webkit-mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 25%,transparent 78%);
          mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 25%,transparent 78%);
}
.bg-glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;opacity:.5}
.bg-glow--cyan{width:46vw;height:46vw;top:-14%;left:-10%;background:radial-gradient(circle,rgba(37,244,238,.5),transparent 65%);animation:driftA 16s ease-in-out infinite alternate}
.bg-glow--pink{width:44vw;height:44vw;bottom:-16%;right:-10%;background:radial-gradient(circle,rgba(254,44,85,.45),transparent 65%);animation:driftB 19s ease-in-out infinite alternate}
@keyframes driftA{to{transform:translate(6vw,5vh) scale(1.08)}}
@keyframes driftB{to{transform:translate(-5vw,-6vh) scale(1.1)}}
#fx-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ---------- 3. Layout shell ---------- */
.shell{position:relative;z-index:2;max-width:1140px;margin:0 auto;padding:0 22px}
main{position:relative;z-index:2}

/* ---------- 4. Header ---------- */
.site-header{
  position:sticky;top:0;z-index:60;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  background:rgba(7,7,15,.55);
  border-bottom:1px solid transparent;
  transition:background .35s var(--ease),border-color .35s var(--ease);
}
.site-header.scrolled{background:rgba(7,7,15,.82);border-color:var(--line)}
.header-inner{max-width:1140px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--font-display);font-weight:800;font-size:1.12rem;letter-spacing:.02em}
.brand .logo{width:36px;height:36px;filter:drop-shadow(0 0 10px rgba(37,244,238,.45))}
.brand em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.main-nav{display:flex;gap:26px;margin-left:auto}
.main-nav a{font-size:.92rem;font-weight:600;color:var(--muted);position:relative;transition:color .25s}
.main-nav a::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;width:0;background:var(--grad);border-radius:2px;transition:width .3s var(--ease)}
.main-nav a:hover{color:var(--text)}
.main-nav a:hover::after{width:100%}
.status-pill{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  font-size:.78rem;font-weight:700;color:var(--green);
  background:rgba(52,245,164,.08);border:1px solid rgba(52,245,164,.28);
  padding:7px 14px;border-radius:99px;white-space:nowrap;
}
.main-nav + .status-pill{margin-left:0}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green);position:relative}
.status-pill .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--green);animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.4);opacity:0}}

/* ---------- 5. Hero console ---------- */
.console-section{padding:74px 0 30px}
.console-head{max-width:760px}
.kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-size:.74rem;font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);
  animation:riseIn .7s var(--ease) both;
}
.kicker::before{content:"";width:26px;height:2px;background:var(--grad);border-radius:2px}
.console-head h1{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(2.1rem,5.4vw,4rem);
  line-height:1.06;margin:18px 0 14px;letter-spacing:-.01em;
  animation:riseIn .7s .08s var(--ease) both;
}
.console-head h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.console-head h1 .cursor{display:inline-block;width:.55ch;height:.9em;background:var(--cyan);vertical-align:-.08em;margin-left:6px;animation:blink 1.1s steps(1) infinite;border-radius:2px;box-shadow:var(--glow-cyan)}
@keyframes blink{50%{opacity:0}}
.tagline{color:var(--muted);font-size:clamp(.98rem,1.6vw,1.12rem);font-weight:500;animation:riseIn .7s .16s var(--ease) both}
@keyframes riseIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* ---------- 6. Console card (input) ---------- */
.glass{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 60px rgba(0,0,0,.45);
}
.console-card{margin-top:34px;padding:22px;position:relative;overflow:hidden;animation:riseIn .7s .24s var(--ease) both}
.console-card::before{ /* neon top hairline */
  content:"";position:absolute;top:0;left:8%;right:8%;height:2px;background:var(--grad);border-radius:2px;opacity:.85;
  filter:blur(.4px);
}
.input-wrap{
  display:flex;align-items:center;gap:12px;
  background:rgba(7,7,15,.65);border:1px solid var(--line);
  border-radius:var(--r-md);padding:6px 8px 6px 18px;
  transition:border-color .3s,box-shadow .3s;
}
.input-wrap:focus-within{border-color:rgba(37,244,238,.65);box-shadow:0 0 0 3px rgba(37,244,238,.14),var(--glow-cyan)}
.input-wrap.shake{animation:shake .45s var(--ease)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.input-wrap .link-ico{flex:none;width:20px;height:20px;color:var(--cyan)}
#url-input{
  flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);
  font:600 1rem var(--font-body);padding:13px 0;caret-color:var(--cyan);
}
#url-input::placeholder{color:#5d6380;font-weight:500}
.paste-chip{
  flex:none;display:flex;align-items:center;gap:7px;
  font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--cyan);
  border:1px solid rgba(37,244,238,.4);background:rgba(37,244,238,.08);
  padding:9px 15px;border-radius:10px;transition:.25s var(--ease);
}
.paste-chip:hover{background:rgba(37,244,238,.18);box-shadow:var(--glow-cyan);transform:translateY(-1px)}
.btn-row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font:800 .95rem var(--font-body);letter-spacing:.02em;
  padding:15px 28px;border-radius:var(--r-md);position:relative;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s,border-color .25s;
  user-select:none;
}
.btn:active{transform:scale(.97)}
.btn-primary{
  flex:1;min-width:210px;color:#06060d;
  background:linear-gradient(94deg,var(--cyan),#5ee8ff 55%,var(--pink));
  background-size:180% 100%;
  box-shadow:0 10px 34px rgba(37,244,238,.28);
}
.btn-primary:hover{transform:translateY(-2px);background-position:90% 0;box-shadow:0 14px 44px rgba(254,44,85,.32),0 8px 30px rgba(37,244,238,.28)}
.btn-ghost{border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.03)}
.btn-ghost:hover{color:var(--text);border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
.btn .spinner{width:18px;height:18px;border:2.5px solid rgba(6,6,13,.3);border-top-color:#06060d;border-radius:50%;display:none;animation:spin .7s linear infinite}
.btn.is-loading{pointer-events:none;opacity:.9}
.btn.is-loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-ghost .ref-ico{transition:transform .5s var(--ease)}
.btn-ghost.spinning .ref-ico{transform:rotate(-360deg)}
.console-hint{margin-top:14px;font-size:.8rem;color:#626a8a;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.console-hint code{background:rgba(255,255,255,.06);border:1px solid var(--line);padding:2px 8px;border-radius:6px;font-size:.74rem;color:var(--muted)}

/* Stats strip */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .3s var(--ease),border-color .3s}
.stat:hover{transform:translateY(-3px);border-color:rgba(37,244,238,.35)}
.stat-num{font-family:var(--font-display);font-weight:700;font-size:1.45rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
.stat-label{font-size:.78rem;color:var(--muted);font-weight:600}

/* ---------- 7. Preview card ---------- */
.preview-card{
  margin-top:26px;padding:24px;display:grid;grid-template-columns:280px 1fr;gap:28px;
  opacity:0;transform:translateY(26px) scale(.985);
  transition:opacity .4s var(--ease),transform .4s var(--ease);
}
.preview-card.shown{opacity:1;transform:none}
.preview-card.hidden{display:none}
.preview-card .rv{opacity:0;transform:translateY(14px);transition:opacity .55s var(--ease),transform .55s var(--ease);transition-delay:var(--d,0s)}
.preview-card.shown .rv{opacity:1;transform:none}
.pv-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:.25s;background:rgba(255,255,255,.04)}
.pv-close:hover{color:var(--pink);border-color:var(--pink);transform:rotate(90deg)}
.thumb-wrap{position:relative}
.thumb{
  position:relative;border-radius:18px;overflow:hidden;aspect-ratio:9/13.5;
  background:linear-gradient(110deg,#101022 30%,#1b1b36 45%,#101022 60%);
  background-size:200% 100%;animation:shimmer 1.6s linear infinite;
  border:1px solid var(--line);box-shadow:0 16px 44px rgba(0,0,0,.5);
}
@keyframes shimmer{to{background-position:-200% 0}}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s var(--ease),transform 8s linear}
.thumb img.loaded{opacity:1}
.thumb:hover img.loaded{transform:scale(1.06)}
.thumb::after{content:"";position:absolute;inset:0;border-radius:18px;border:1px solid rgba(37,244,238,.28);pointer-events:none;box-shadow:inset 0 0 40px rgba(37,244,238,.06)}
.duration-badge{position:absolute;bottom:10px;right:10px;background:rgba(6,6,13,.8);backdrop-filter:blur(6px);border:1px solid var(--line);font-size:.74rem;font-weight:800;padding:4px 10px;border-radius:8px;letter-spacing:.05em}
.pv-open{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:.82rem;font-weight:700;color:var(--cyan);transition:.25s}
.pv-open:hover{text-shadow:0 0 14px rgba(37,244,238,.7);gap:10px}
.pv-title{font-family:var(--font-display);font-weight:600;font-size:clamp(1rem,1.7vw,1.22rem);line-height:1.4;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pv-author{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{position:relative;width:44px;height:44px;border-radius:50%;flex:none;background:var(--grad);padding:2px}
.avatar-in{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#12122a;display:grid;place-items:center;font:800 .95rem var(--font-display);color:var(--cyan)}
.avatar-in img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pv-author-meta strong{display:block;font-size:.95rem}
.pv-author-meta span{font-size:.8rem;color:var(--muted);font-weight:600}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;font-weight:700;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.04);padding:6px 12px;border-radius:99px}
.chip svg{width:13px;height:13px;color:var(--cyan)}
.chip.chip-music{max-width:100%}
.chip.chip-music span{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Download buttons */
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dl-btn{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:13px;text-align:left;
  padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);
  background:rgba(255,255,255,.045);transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s,background .28s;
}
.dl-btn::before{ /* live download progress fill */
  content:"";position:absolute;inset:0;width:var(--prog,0%);
  background:linear-gradient(90deg,rgba(37,244,238,.22),rgba(254,44,85,.22));
  transition:width .25s ease;pointer-events:none;
}
.dl-btn:hover{transform:translateY(-3px)}
.dl-btn:active{transform:scale(.98)}
.dl-btn.is-disabled{opacity:.42;filter:grayscale(.6);pointer-events:none}
.dl-nowm{grid-column:1/-1;background:linear-gradient(94deg,rgba(37,244,238,.16),rgba(254,44,85,.14));border-color:rgba(37,244,238,.5)}
.dl-nowm:hover{box-shadow:0 14px 36px rgba(37,244,238,.22);border-color:var(--cyan)}
.dl-wm:hover{box-shadow:0 12px 30px rgba(254,44,85,.2);border-color:var(--pink)}
.dl-mp3:hover{box-shadow:0 12px 30px rgba(139,92,246,.24);border-color:var(--violet)}
.dl-ico{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.dl-nowm .dl-ico{background:rgba(37,244,238,.16);color:var(--cyan)}
.dl-wm .dl-ico{background:rgba(254,44,85,.16);color:var(--pink)}
.dl-mp3 .dl-ico{background:rgba(139,92,246,.18);color:var(--violet)}
.dl-ico svg{width:21px;height:21px}
.dl-copy{flex:1;min-width:0}
.dl-copy strong{display:block;font-size:.92rem;font-weight:800;letter-spacing:.01em}
.dl-copy small{display:block;font-size:.74rem;color:var(--muted);font-weight:600;margin-top:2px}
.dl-state{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.62rem;font-weight:800;color:var(--muted)}
.dl-state svg{width:14px;height:14px}
.dl-btn.is-downloading .dl-state svg{display:none}
.dl-btn.is-downloading .dl-state{border-color:var(--cyan);color:var(--cyan);animation:pulseGlow 1s ease infinite}
@keyframes pulseGlow{50%{box-shadow:0 0 14px rgba(37,244,238,.6)}}
.pv-foot{margin-top:14px;font-size:.76rem;color:#626a8a;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- 8. Ticker ---------- */
.ticker{margin:56px 0 0;border-block:1px solid var(--line);background:rgba(255,255,255,.02);overflow:hidden;padding:13px 0;position:relative;z-index:2}
.ticker-track{display:flex;gap:44px;width:max-content;animation:tickerMove 28s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track span{font-family:var(--font-display);font-weight:600;font-size:.82rem;letter-spacing:.22em;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:44px}
.ticker-track span i{font-style:normal;color:var(--pink)}
@keyframes tickerMove{to{transform:translateX(-50%)}}

/* ---------- 9. Section scaffolding ---------- */
section{position:relative;z-index:2}
.section-pad{padding:88px 0 0}
.sec-head{max-width:640px;margin-bottom:40px}
.sec-head h2{font-family:var(--font-display);font-weight:700;font-size:clamp(1.55rem,3.4vw,2.3rem);line-height:1.15;margin-top:14px}
.sec-head p{color:var(--muted);margin-top:10px}

/* ---------- 10. Features bento ---------- */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.tile{
  grid-column:span 2;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:26px;position:relative;overflow:hidden;
  transition:transform .35s var(--ease),border-color .35s,box-shadow .35s;
}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 180px at var(--mx,50%) var(--my,0%),rgba(37,244,238,.09),transparent 70%);opacity:0;transition:opacity .4s;pointer-events:none}
.tile:hover{transform:translateY(-5px);border-color:rgba(37,244,238,.35);box-shadow:0 20px 46px rgba(0,0,0,.4)}
.tile:hover::after{opacity:1}
.tile--w3{grid-column:span 3}
.tile-ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:18px;background:rgba(37,244,238,.12);color:var(--cyan)}
.tile:nth-child(2) .tile-ico{background:rgba(254,44,85,.13);color:var(--pink)}
.tile:nth-child(3) .tile-ico{background:rgba(139,92,246,.16);color:var(--violet)}
.tile:nth-child(4) .tile-ico{background:rgba(52,245,164,.12);color:var(--green)}
.tile:nth-child(5) .tile-ico{background:rgba(254,44,85,.13);color:var(--pink)}
.tile-ico svg{width:22px;height:22px}
.tile h3{font-family:var(--font-display);font-weight:600;font-size:1.02rem;margin-bottom:9px}
.tile p{font-size:.88rem;color:var(--muted)}
/* mini visuals inside tiles */
.wm-demo{margin-top:18px;display:flex;align-items:center;gap:10px}
.wm-demo .mini-frame{width:56px;height:84px;border-radius:9px;background:linear-gradient(160deg,#191932,#232345);border:1px solid var(--line);position:relative;overflow:hidden}
.wm-demo .wm-tag{position:absolute;bottom:6px;right:5px;font-size:.42rem;font-weight:800;background:rgba(254,44,85,.9);padding:2px 4px;border-radius:3px;animation:wmAway 2.6s var(--ease) infinite}
@keyframes wmAway{0%,35%{opacity:1;transform:none}60%,80%{opacity:0;transform:translateY(9px) scale(.7)}100%{op
