<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snap-Tok | Ultra-Fast TikTok Downloader</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #07090e;
      --card-bg: rgba(18, 22, 33, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-green: #00e676;
      --accent-purple: #7928ca;
      --accent-pink: #ff0080;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.15), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(121, 40, 202, 0.15), transparent 50%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.2);
      color: var(--accent-cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #ff0080 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Main Box */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }

    .input-box {
      position: relative;
      margin-bottom: 14px;
    }

    .input-box input {
      width: 100%;
      padding: 16px 45px 16px 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-box input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }

    .paste-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-fetch {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #000;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
      transition: all 0.3s ease;
    }

    .btn-fetch:active {
      transform: scale(0.98);
    }

    .btn-refresh {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Result Card (Futuristic) */
    .result-card {
      display: none;
      margin-top: 20px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .video-info {
      display: flex;
      gap: 14px;
      margin-bottom: 16px;
    }

    .cover-img {
      width: 90px;
      height: 120px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: #1a1a1a;
    }

    .details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .author {
      color: var(--accent-cyan);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .caption {
      color: #d1d5db;
      font-size: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Futuristic Download Buttons */
    .download-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dl-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      color: #fff;
      text-decoration: none;
    }

    .dl-no-wm {
      background: linear-gradient(135deg, #00b09b, #96c93d);
      box-shadow: 0 4px 15px rgba(0, 176, 155, 0.25);
    }

    .dl-wm {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      box-shadow: 0 4px 15px rgba(106, 17, 203, 0.25);
    }

    .dl-mp3 {
      background: linear-gradient(135deg, #ff0844, #ffb199);
      box-shadow: 0 4px 15px rgba(255, 8, 68, 0.25);
    }

    .dl-btn:active {
      transform: scale(0.98);
    }

    .loader {
      display: none;
      text-align: center;
      padding: 15px;
      font-size: 13px;
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="status-badge">
        <span class="status-dot"></span> API ONLINE & READY
      </div>
      <h1 class="title">Snap-Tok</h1>
      <p class="subtitle">Ultra-Fast TikTok Video & MP3 Downloader</p>
    </div>

    <div class="glass-card">
      <div class="input-box">
        <input type="text" id="tiktokUrl" placeholder="Paste TikTok link here..." />
        <button class="paste-btn" onclick="pasteClipboard()">Paste</button>
      </div>

      <button class="btn-fetch" onclick="fetchTikTokVideo()">
        ⚡ Fetch Video
      </button>

      <button class="btn-refresh" onclick="resetForm()">
        🔄 Refresh Page
      </button>

      <div class="loader" id="loader">
        ⏳ Fetching media, please wait...
      </div>

      <div class="result-card" id="resultCard">
        <div class="video-info">
          <img src="" id="coverImage" class="cover-img" alt="Cover Image" />
          <div class="details">
            <div class="author" id="authorHandle">@author</div>
            <div class="caption" id="videoCaption">Video Caption Here</div>
          </div>
        </div>

        <div class="download-actions">
          <button class="dl-btn dl-no-wm" id="btnNoWm">
            ↓ Download Without Watermark
          </button>
          <button class="dl-btn dl-wm" id="btnWm">
            ↓ Download With Watermark
          </button>
          <button class="dl-btn dl-mp3" id="btnMp3">
            🎵 Download MP3 Audio
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('tiktokUrl').value = text;
      } catch (err) {
        alert("Clipboard paste permission denied!");
      }
    }

    function resetForm() {
      document.getElementById('tiktokUrl').value = '';
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('loader').style.display = 'none';
    }

    async function fetchTikTokVideo() {
      const urlInput = document.getElementById('tiktokUrl').value.trim();
      const loader = document.getElementById('loader');
      const resultCard = document.getElementById('resultCard');

      if (!urlInput) {
        alert('Kripya pehle TikTok video ka link paste karein!');
        return;
      }

      loader.style.display = 'block';
      resultCard.style.display = 'none';

      try {
        // High-reliability TikTok API Endpoint
        const apiUrl = `https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(urlInput)}`;
        const response = await fetch(apiUrl);
        const data = await response.json();

        loader.style.display = 'none';

        if (data && (data.video || data.url)) {
          // Video Details update (Dynamic for exact link)
          document.getElementById('coverImage').src = data.cover || data.origin_cover || '';
          document.getElementById('authorHandle').innerText = `@${data.author?.unique_id || data.author?.nickname || 'tiktok_user'}`;
          document.getElementById('videoCaption').innerText = data.title || 'No caption available';

          // Download links setup
          const noWmUrl = data.video?.noWatermark || data.url || '';
          const wmUrl = data.video?.watermark || data.url || '';
          const mp3Url = data.music?.play_url || data.audio || '';

          // Direct Download Handlers (Without external tab redirect)
          document.getElementById('btnNoWm').onclick = () => triggerDirectDownload(noWmUrl, 'TikTok_NoWatermark.mp4');
          document.getElementById('btnWm').onclick = () => triggerDirectDownload(wmUrl, 'TikTok_Watermark.mp4');
          document.getElementById('btnMp3').onclick = () => triggerDirectDownload(mp3Url, 'TikTok_Audio.mp3');

          resultCard.style.display = 'block';
        } else {
          alert('Video detail fetch nahi ho saki. Kripya valid link check karein!');
        }
      } catch (error) {
        loader.style.display = 'none';
        alert('Server se fetch karne me error aaya. Direct API call block ho sakti hai.');
        console.error(error);
      }
    }

    // Direct Seamless Download Function (Bina kisi extra page kholne ke)
    async function triggerDirectDownload(fileUrl, fileName) {
      if (!fileUrl) {
        alert('Download link available nahi hai.');
        return;
      }

      try {
        const response = await fetch(fileUrl);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = blobUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        
        window.URL.revokeObjectURL(blobUrl);
        document.body.removeChild(a);
      } catch (err) {
        // Fallback for cross-origin restricted direct links
        const a = document.createElement('a');
        a.href = fileUrl;
        a.download = fileName;
        a.target = '_self';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }
  </script>
</body>
  </html>
